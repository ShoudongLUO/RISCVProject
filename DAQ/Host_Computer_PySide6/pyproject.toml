[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fpga-daq"
version = "1.0.0"
description = "FPGA Data Acquisition Host Computer"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0,<7.0.0",
    "pyqtgraph>=0.13.7",
    "numpy>=1.26.0",
]

[project.scripts]
fpga-daq = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
